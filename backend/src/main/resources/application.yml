server:
  port: 8081

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/ar_tourist_db
    username: postgres
    password: postgres_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: true