server:
  port: 8082

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ar_tourist_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

groq:
  api:
    key: ${GROQ_API_KEY:}
    url: https://api.groq.com/openai/v1/chat/completions
    model: openai/gpt-oss-120b

aws:
  s3:
    region: ${AWS_S3_REGION:eu-north-1}
    bucket: ${AWS_S3_BUCKET:}
  cdn:
    base-url: ${AWS_CDN_BASE_URL:}

ai-service:
  url: ${AI_SERVICE_URL:http://localhost:8090}
  search-radius-meters: ${AI_SEARCH_RADIUS_METERS:150.0}