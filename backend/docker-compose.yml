version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: ar_tourist_db
    environment:
      POSTGRES_DB: ar_tourist_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: