buildscript {
    ext {
        buildToolsVersion = "37.0.0"
        minSdkVersion = 24
        compileSdkVersion = 37
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.2.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

def customBuildRoot = new File(System.getProperty("java.io.tmpdir"), "BrooBuild")

subprojects { subproject ->
    if (subproject.name == "app") {
        subproject.buildDir = new File(customBuildRoot, "${rootProject.name}/${subproject.name}")
    }
    subproject.plugins.withId("com.android.library") {
        subproject.android {
            externalNativeBuild {
                cmake {
                    buildStagingDirectory = new File(customBuildRoot, "cxx/${subproject.name}")
                }
            }
        }
    }
}